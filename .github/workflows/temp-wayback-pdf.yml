name: Récupération temporaire Wayback des PDF
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: python -m pip install --upgrade pypdf
      - name: Récupérer les instantanés PDF
        run: |
          set +e
          python temp_wayback_pdf_recovery.py > run_wayback.log 2>&1
          status=$?
          cat run_wayback.log
          exit $status
      - name: Créer l'archive
        if: always()
        run: |
          python - <<'PY'
          import shutil
          shutil.make_archive("notes-master-math-france-wayback", "zip", "notes_master_math_france_wayback")
          PY
      - name: Publier l'archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-master-math-france-wayback
          path: |
            notes-master-math-france-wayback.zip
            notes_master_math_france_wayback/manifest.csv
            notes_master_math_france_wayback/manifest.json
            run_wayback.log
          if-no-files-found: error
          retention-days: 3
