name: Collecte officielle agrégation externe
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install --upgrade requests beautifulsoup4 lxml pypdf
      - name: Télécharger les archives officielles avec temporisation
        run: python temp_collect_official_agregation.py
      - name: Publier l'archive
        uses: actions/upload-artifact@v4
        with:
          name: agregation-externe-officiel-complet
          path: |
            agregation_externe_officiel_complet.zip
            agregation_externe_officiel_complet/SUMMARY.json
            agregation_externe_officiel_complet/MANIFEST.csv
            agregation_externe_officiel_complet/README.md
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
