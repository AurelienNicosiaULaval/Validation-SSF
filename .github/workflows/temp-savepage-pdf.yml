name: Récupération temporaire PDF par Save Page Now
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer pypdf
        run: python -m pip install --upgrade pypdf
      - name: Capturer et récupérer les PDF
        run: |
          set +e
          python temp_savepage_pdf_recovery.py > run_savepage.log 2>&1
          status=$?
          cat run_savepage.log
          exit $status
      - name: Créer l'archive
        if: always()
        run: |
          python - <<'PY'
          import shutil
          shutil.make_archive("notes-master-math-france-savepage", "zip", "notes_master_math_france_savepage")
          PY
      - name: Publier l'archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-master-math-france-savepage
          path: |
            notes-master-math-france-savepage.zip
            notes_master_math_france_savepage/manifest.csv
            notes_master_math_france_savepage/manifest.json
            run_savepage.log
          if-no-files-found: error
          retention-days: 3
